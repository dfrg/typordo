<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- A generic expanded by an alias, the shape 45-latin.conf uses. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Preferred Sans</family><family>Second Sans</family></prefer>
    <default><family>Last Resort Sans</family></default>
  </alias>

  <!-- binding="same" on an accept inherits the matched value's binding;
       on a default it cannot, because append_last ignores the mark. -->
  <alias binding="same">
    <family>Inheriting</family>
    <accept><family>Accepted Same</family></accept>
    <default><family>Defaulted Same</family></default>
  </alias>

  <!-- A plain match with a test and an assign. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Rename Me</string></test>
    <edit name="family" mode="assign"><string>Renamed</string></edit>
  </match>

  <!-- Arithmetic and a field reference. -->
  <match target="pattern">
    <test name="family"><string>Doubler</string></test>
    <edit name="weight" mode="assign">
      <times><name>weight</name><int>2</int></times>
    </edit>
  </match>

  <!-- A conditional. -->
  <match target="pattern">
    <test name="family"><string>Conditional</string></test>
    <edit name="slant" mode="assign">
      <if><more><name>weight</name><int>100</int></more><int>100</int><int>0</int></if>
    </edit>
  </match>

  <!-- A comparison that must fail, so its edit never runs. -->
  <match target="pattern">
    <test name="family"><string>NeverMatches</string></test>
    <test name="weight" compare="more"><int>1000</int></test>
    <edit name="family" mode="assign"><string>Should Not Appear</string></edit>
  </match>

  <!-- delete and prepend_first. -->
  <match target="pattern">
    <test name="family"><string>Deleter</string></test>
    <edit name="spacing" mode="delete_all"/>
    <edit name="family" mode="prepend_first"><string>Prepended</string></edit>
  </match>

  <!-- A scan rule that takes languages away from a font that only appears
       to support them, the way the GNU FreeFont configs do. -->
  <match target="scan">
    <test name="family"><string>Overclaims</string></test>
    <edit name="lang" mode="assign">
      <minus>
        <name>lang</name>
        <langset><string>hi</string><string>mr</string><string>NOT-A-LANGUAGE</string></langset>
      </minus>
    </edit>
  </match>

  <!-- The same, adding rather than removing. -->
  <match target="scan">
    <test name="family"><string>Underclaims</string></test>
    <edit name="lang" mode="assign">
      <plus>
        <name>lang</name>
        <langset><string>ja</string></langset>
      </plus>
    </edit>
  </match>

  <!-- A <range> literal, which the parser had no value shape for. -->
  <match target="pattern">
    <test name="family"><string>Ranged</string></test>
    <edit name="weight" mode="assign">
      <range><int>40</int><int>210</int></range>
    </edit>
  </match>

  <!-- A <charset> literal built from a span rather than single codepoints. -->
  <match target="pattern">
    <test name="family"><string>Spanned</string></test>
    <edit name="charset" mode="assign">
      <charset><int>0x41</int><range><int>0x61</int><int>0x63</int></range></charset>
    </edit>
  </match>

  <!-- A <matrix> literal in a rule, which read the wrong list of children. -->
  <match target="pattern">
    <test name="family"><string>Skewed</string></test>
    <edit name="matrix" mode="assign">
      <matrix><double>1</double><double>0.2</double><double>0</double><double>1</double></matrix>
    </edit>
  </match>

  <!-- An alias may carry tests of its own, which make it conditional:
       `FcParseAlias` puts them ahead of the family test it synthesizes, and
       all of them have to pass for the alias to apply. -->
  <alias>
    <test name="weight" compare="more_eq"><int>200</int></test>
    <family>Conditional</family>
    <prefer><family>Heavy Substitute</family></prefer>
  </alias>
</fontconfig>
