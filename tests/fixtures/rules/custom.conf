<?xml version="1.0"?>
<fontconfig>
  <!-- A property fontconfig does not define, used as a scratch variable. -->
  <match target="pattern">
    <test name="family"><string>Scratch</string></test>
    <edit name="scratchfactor" mode="assign">
      <divide><name>pixelsize</name><double>8.0</double></divide>
    </edit>
  </match>

  <!-- Read it back in a later rule. -->
  <match target="pattern">
    <test name="scratchfactor" compare="more"><double>1.0</double></test>
    <edit name="weight" mode="assign">
      <times><name>scratchfactor</name><double>24.0</double></times>
    </edit>
  </match>
</fontconfig>
