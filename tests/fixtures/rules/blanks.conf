<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Whether a <test> treats a space as a character.

     Fontconfig folds case either way but only strips blanks when asked, so
     "Deja Vu" and "DejaVu" are the same family to one of these tests and
     different families to the other. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>DejaVu Sans</string>
    </test>
    <edit name="foundry" mode="assign"><string>blanks-significant</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>DejaVuSans</string>
    </test>
    <edit name="weight" mode="assign"><int>210</int></edit>
  </match>
</fontconfig>
