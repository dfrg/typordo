<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A synthetic config exercising the elements this crate reads.
     Contains <angle brackets> and a [bracket] to keep the scanner honest. -->
<fontconfig>
  <dir>/synthetic/fonts</dir>
  <dir>/synthetic/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir>/synthetic/cache</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Rules this slice does not read; they must be skipped, not misparsed. -->
  <match target="pattern">
    <test qual="any" name="family"><string>mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>

  <include prefix="relative" ignore_missing="yes">conf.d</include>
  <include prefix="relative" ignore_missing="yes">not-there.conf</include>
</fontconfig>
