<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- <reset-dirs/> empties the font directory list and nothing else.

     A generated or sandboxed configuration includes the system one and then
     discards the directories it brought, keeping its rules and caches. -->
<fontconfig>
  <dir>/synthetic/inherited</dir>
  <dir>/synthetic/also-inherited</dir>
  <cachedir>/synthetic/cache</cachedir>
  <reset-dirs/>
  <dir>/synthetic/mine</dir>
</fontconfig>
