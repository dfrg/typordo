<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/synthetic/fonts</dir>

  <selectfont>
    <rejectfont>
      <glob>/synthetic/fonts/bitmap/*</glob>
      <glob>*.pcf.gz</glob>
      <pattern>
        <patelt name="family"><string>Banned Family</string></patelt>
      </pattern>
      <pattern>
        <patelt name="foundry"><string>ACME</string></patelt>
        <patelt name="slant"><int>100</int></patelt>
      </pattern>
    </rejectfont>
    <acceptfont>
      <glob>/synthetic/fonts/bitmap/keep.pcf</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
